services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: todo
      MYSQL_USER: todo
      MYSQL_PASSWORD: todo_local_password
      MYSQL_ROOT_PASSWORD: root_local_password
    volumes:
      - todo_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  app:
    build: .
    environment:
      DATABASE_URL: mysql+pymysql://todo:todo_local_password@db:3306/todo
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
    ports:
      - "127.0.0.1:8080:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/state')"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
volumes:
  todo_data:

